[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dc-thermal-fusion"
version = "0.1.0"
description = "FLIR A310 + DS18B20 thermal fusion"
license = {text = "MIT"}
requires-python = ">=3.11"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/gagisc/dc-thermal-fusion"
Repository = "https://github.com/gagisc/dc-thermal-fusion"
Issues = "https://github.com/gagisc/dc-thermal-fusion/issues"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "experiments", "streamlit_app"]

[tool.ruff.lint]
select = ["E","W","F","I","UP","B","C4","SIM","S","ANN"]
ignore = [
    "ANN101","ANN102","ANN401",
    "S101",   # assert in tests
    "S603","S607",  # subprocess — intentional in experiment runners
    "S311",
]
per-file-ignores = {"tests/*.py" = ["S","ANN"], "experiments/*.py" = ["ANN","S"]}

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["notebooks/","experiments/"]

[[tool.mypy.overrides]]
module = ["torch.*","torchvision.*","cv2.*","av.*","streamlit.*","plotly.*",
          "pysnmp.*","pymodbus.*","tigramite.*","dowhy.*","gymnasium.*",
          "stable_baselines3.*","pylepton.*","onvif.*","paho.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --no-header -rN"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.bandit]
skips = ["B101","B603","B607","B311"]
exclude_dirs = ["tests","notebooks","experiments"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*","experiments/*","notebooks/*","*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 50
